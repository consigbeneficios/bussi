<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fatura — CONSIG BENEFÍCIOS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#11151a;--muted:#6d737c;--line:#e4e7eb;--soft:#f0f2f4;--green:#47b4a7;--green2:#2d9488}
*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.page{max-width:1060px;margin:auto;min-height:100vh;background:#fff}.top{padding:28px 30px 36px}.download{border:0;background:transparent;padding:0;display:inline-flex;align-items:center;gap:8px;font-weight:750;color:#242930}.download svg{width:18px}.brandline{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:30px}.logo{width:70px;height:70px;border-radius:50%;background:#101722;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900}.company{font-size:25px;font-weight:850;letter-spacing:-.03em;margin:22px 0 3px}.cnpj{font-size:12px;color:#787e86;margin-bottom:17px}.amount{font-size:48px;font-weight:900;letter-spacing:-.045em}.due{font-size:16px;color:#343a42;margin-top:7px}.invoice{font-size:18px;font-weight:750;margin-top:22px}.badge{display:inline-flex;margin-top:8px;background:#e8f7f3;color:#13715f;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}.rule{border-top:1px solid var(--line);margin:28px 0 0}.details{padding-top:22px}.item{display:flex;justify-content:space-between;gap:20px;margin-bottom:20px}.item small{display:block;color:var(--muted);margin-top:4px}.row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;font-size:14px}.row b{font-variant-numeric:tabular-nums}.row.original b{text-decoration:line-through;text-decoration-thickness:2px;color:#565c64}.row.discount{color:#17705c}.row.total{margin-top:8px;background:#e6e7e8;padding:14px 12px;font-size:16px;font-weight:900}.payband{background:#eef0f2;padding:32px 25px}.card{max-width:520px;margin:auto;background:#fff;border-radius:20px;padding:28px;box-shadow:0 8px 26px rgba(0,0,0,.05)}.card h2{margin:0;font-size:20px}.card p{color:var(--muted);font-size:13px;line-height:1.5}.status{background:#fff7e8;border:1px solid #f4dfb8;border-radius:13px;padding:14px;margin:18px 0;color:#725016;font-size:13px;line-height:1.45}.status b{display:block;color:#4c360f;margin-bottom:4px}.qr{display:grid;place-items:center;margin:20px auto;width:220px;height:220px;background:#fff}.pixcode{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#f8f9fa;font-size:11px;min-height:66px;word-break:break-all}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;margin-top:10px}.btn.pay{background:var(--green);color:#fff}.btn.pay:hover{background:var(--green2)}.legal{text-align:center;background:#eef0f2;padding:18px 20px 28px;color:#6d737c;font-size:11px;line-height:1.6}.legal a{color:inherit;margin:0 6px}.error{max-width:600px;margin:80px auto;background:#fff;padding:30px;border-radius:16px}.error h1{font-size:22px}
@media(min-width:850px){.page{display:grid;grid-template-columns:1.05fr .95fr;grid-template-rows:1fr auto}.top{padding:46px 60px}.payband{display:flex;align-items:center;padding:48px}.card{width:100%}.legal{grid-column:1/-1}.logo{width:86px;height:86px}.amount{font-size:54px}}
@media(max-width:500px){.top{padding:24px}.amount{font-size:43px}.company{font-size:22px}.payband{padding:22px 14px}.card{padding:22px}.qr{width:200px;height:200px}}
</style>
</head>
<body><div id="app"></div>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function decode(){try{const p=new URLSearchParams(location.hash.slice(1)).get('p');if(!p)return null;let s=p.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}catch{return null}}function fmtDate(v){if(!v)return '—';const d=new Date(v+'T12:00:00');return d.toLocaleDateString('pt-BR')}
function track(d,event){if(!d.trackingEndpoint)return;const payload=JSON.stringify({event,invoice:d.invoice,customer:d.customer,amount:d.amount,at:new Date().toISOString(),page:location.href,userAgent:navigator.userAgent});try{if(navigator.sendBeacon){navigator.sendBeacon(d.trackingEndpoint,new Blob([payload],{type:'text/plain;charset=UTF-8'}));return}fetch(d.trackingEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:payload,keepalive:true}).catch(()=>{})}catch{}}
const d=decode();if(!d){document.getElementById('app').innerHTML='<div class="error"><h1>Link de cobrança inválido</h1><p>Não foi possível localizar os dados desta fatura. Solicite um novo link ao atendimento.</p><a href="politica-de-privacidade.html">Política de Privacidade</a></div>';throw new Error('invalid payload')}
track(d,'link_opened');
const discountValue=Math.max(0,Number(d.original||d.amount)-Number(d.amount||0));
document.getElementById('app').innerHTML=`<main class="page">
<section class="top">
<button class="download" id="downloadCharge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14"/></svg>Baixar fatura</button>
<div class="brandline"><div class="logo">CB</div></div>
<div class="company">${esc(d.company||'CONSIG BENEFÍCIO S/A')}</div>
<div class="cnpj">CNPJ: ${esc(d.cnpj||'66.754.630/0001-60')}</div>
<div class="amount">${money(d.amount)}</div>
<div class="due">Vencimento: ${fmtDate(d.due)}</div>
<div class="invoice">Cobrança n.º ${esc(d.invoice||'—')}</div>
<div class="badge">${Number(d.discount||50).toFixed(0)}% OFF aplicado</div>
<div class="rule"></div>
<div class="details">
<div class="item"><div><b>Consig Benefícios</b><small>Quantidade: ${Number(d.quantity||1)} · ${esc(d.description||'P/Consignado')}</small></div><b>${money(d.amount)}</b></div>
<div class="row original"><span>Parcela original</span><b>${money(d.original||d.amount)}</b></div>
<div class="row discount"><span>Desconto ${Number(d.discount||50).toFixed(0)}% OFF</span><b>− ${money(discountValue)}</b></div>
<div class="row"><span>Parcela com desconto</span><b>${money(d.amount)}</b></div>
<div class="row total"><span>Valor a ser pago</span><b>${money(d.amount)}</b></div>
</div>
</section>
<section class="payband"><div class="card"><h2>Pagamento via Pix</h2><p>Escaneie o QR Code ou copie o código Pix abaixo.</p><div class="status"><b>Aguardando confirmação do pagamento</b>Assim que o pagamento for confirmado, enviaremos um link com o comprovante de liquidação da parcela paga.</div><div class="qr" id="qr"></div><div class="pixcode">${esc(d.pix||'')}</div><button class="btn pay" id="copyPix">Copiar código PIX</button></div></section>
<footer class="legal">Cobrança emitida por <b>${esc(d.company||'CONSIG BENEFÍCIO S/A')}</b> · CNPJ ${esc(d.cnpj||'66.754.630/0001-60')}<br>${esc(d.email||'sac@consigbeneficio.com.br')}<br><a href="termos-de-uso.html">Termos de Uso</a> · <a href="politica-de-privacidade.html">Política de Privacidade</a> · <a href="exclusao-de-dados.html">Exclusão de Dados</a></footer>
</main>`;
new QRCode(document.getElementById('qr'),{text:d.pix||'',width:200,height:200,correctLevel:QRCode.CorrectLevel.M});
document.getElementById('copyPix').onclick=async()=>{try{await navigator.clipboard.writeText(d.pix||'');document.getElementById('copyPix').textContent='Código PIX copiado';setTimeout(()=>document.getElementById('copyPix').textContent='Copiar código PIX',1300)}catch{alert('Não foi possível copiar automaticamente. Selecione o código acima.')}}
function invoiceMarkup(){const issue=fmtDate(d.issueDate);return `<!doctype html><html><head><meta charset="utf-8"><title>Fatura ${esc(d.invoice)}</title><style>@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#171717}.p{width:210mm;height:297mm;padding:22mm 18mm;position:relative}.topi{display:flex;justify-content:space-between}.co b{font-size:12px}.co small{display:block;color:#666;margin-top:3px}.customer{font-size:17px;font-weight:700;margin-top:30mm}.meta{width:78mm}.meta h1{font-size:21px}.line{display:flex;justify-content:space-between;border-top:1px solid #ddd;padding:7px 0;font-size:12px}.tbl{width:100%;border-collapse:collapse;margin-top:28mm;font-size:11px}.tbl th{background:#e6e6e6;text-align:left;padding:9px}.tbl td{padding:10px 9px;border-bottom:1px solid #eee}.num{text-align:right!important}.tot{width:82mm;margin:16mm 0 0 auto}.tr{display:flex;justify-content:space-between;padding:7px 9px;font-size:12px}.tr.original b{text-decoration:line-through;text-decoration-thickness:2px}.tr.final{font-weight:800;background:#e4e4e4;font-size:14px}.foot{position:absolute;bottom:18mm;left:18mm;right:18mm;text-align:center;color:#666;font-size:10px;line-height:1.5}</style></head><body><div class="p"><div class="topi"><div class="co"><b>${esc(d.company)}</b><small>CNPJ: ${esc(d.cnpj)}</small><small>${esc(d.companyAddress||'')}</small><div class="customer">${esc(d.customer)}</div></div><div class="meta"><h1>Fatura</h1><div class="line"><span>Fatura</span><b>${esc(d.invoice)}</b></div><div class="line"><span>Data de emissão</span><b>${issue}</b></div></div></div><table class="tbl"><thead><tr><th>Descrição</th><th>Unidade</th><th class="num">P/Total</th><th class="num">P/Desconto</th></tr></thead><tbody><tr><td>Black Friday 50% OFF — ${esc(d.description||'P/Consignado')} — Competência: Dezembro</td><td>1</td><td class="num">${money(d.original)}</td><td class="num">${money(d.amount)}</td></tr></tbody></table><div class="tot"><div class="tr original"><span>Parcela original</span><b>${money(d.original)}</b></div><div class="tr"><span>Parcela com desconto</span><b>${money(d.amount)}</b></div><div class="tr final"><span>VALOR A SER PAGO</span><span>${money(d.amount)}</span></div></div><div class="foot"><b>${esc(d.company)}</b><br>CNPJ: ${esc(d.cnpj)} · ${esc(d.email)}<br>${esc(d.companyAddress||'')}</div></div></body></html>`}
document.getElementById('downloadCharge').onclick=()=>{track(d,'invoice_download');const w=window.open('','_blank');if(!w)return alert('Permita pop-ups para baixar a fatura.');w.document.open();w.document.write(invoiceMarkup());w.document.close();setTimeout(()=>{w.focus();w.print()},300)};
</script>
</body>
</html>
