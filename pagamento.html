<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fatura — CONSIG BENEFÍCIOS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#15181c;--muted:#70767d;--line:#e5e7e9;--panel:#f1f2f3;--teal:#55b8ac;--teal2:#3ba195;--soft:#f8f9f9}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#eceeef}
button{font:inherit;cursor:pointer}.page{width:min(1120px,100%);min-height:100vh;margin:0 auto;background:#fff;display:grid;grid-template-columns:1.06fr .94fr;box-shadow:0 0 32px rgba(0,0,0,.05)}
.left{padding:42px 58px 34px}.right{background:var(--panel);padding:44px 42px;display:flex;align-items:center;justify-content:center}
.download{border:0;background:transparent;color:#24282c;padding:0;display:inline-flex;align-items:center;gap:8px;font-weight:750;font-size:14px}.download svg{width:18px;height:18px}
.logo-row{display:flex;justify-content:flex-end;margin-top:28px}.logo{width:86px;height:86px;object-fit:cover;border-radius:17px;display:block}
.company{font-size:26px;font-weight:850;letter-spacing:-.035em;margin-top:24px}.cnpj{font-size:12px;color:var(--muted);margin-top:3px}.address{font-size:11px;color:#898f95;line-height:1.45;margin-top:6px;max-width:420px}
.amount{font-size:55px;font-weight:900;letter-spacing:-.055em;line-height:1;margin-top:30px}.due{font-size:15px;margin-top:10px}.invoice-no{font-size:18px;font-weight:780;margin-top:28px}.issue{font-size:12px;color:var(--muted);margin-top:4px}
.badge{display:inline-flex;margin-top:10px;background:#e9f7f3;color:#176d5b;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}.divider{height:1px;background:var(--line);margin:28px 0 20px}
.client{font-size:12px;color:var(--muted);margin-bottom:18px}.client b{display:block;color:var(--ink);font-size:15px;margin-bottom:3px}
.item{display:grid;grid-template-columns:1fr auto;gap:20px;padding:4px 0 20px}.item b{font-size:14px}.item small{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.summary{border-top:1px solid var(--line);padding-top:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:8px 0;font-size:14px}.row.original strong{text-decoration:line-through;text-decoration-thickness:2px;color:#565b60}.row.discount{color:#19705e}.row.total{background:#eceeef;margin-top:8px;padding:15px 13px;font-size:16px;font-weight:900}
.card{width:min(500px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 6px 22px rgba(0,0,0,.05)}.card h1{font-size:27px;line-height:1.15;margin:0 0 9px}.card>p{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 18px}
.qr{width:224px;height:224px;margin:18px auto;display:grid;place-items:center;background:#fff}.pixlabel{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#737a81;margin-bottom:7px}.pixcode{border:1px solid #dfe3e6;background:#fafafa;border-radius:10px;padding:11px 12px;min-height:66px;font-size:11px;line-height:1.45;word-break:break-all}
.copy{width:100%;border:0;border-radius:11px;padding:13px 16px;margin-top:10px;background:var(--teal);color:#fff;font-weight:850}.copy:hover{background:var(--teal2)}
.helper{font-size:11px;color:#777d83;line-height:1.5;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.legal{grid-column:1/-1;background:#f0f1f2;text-align:center;padding:17px 20px 24px;font-size:10px;line-height:1.6;color:#757b81}.legal a{color:inherit;margin:0 5px}.error{max-width:600px;margin:70px auto;background:#fff;padding:30px;border-radius:16px}
@media(max-width:860px){.page{display:block}.left{padding:26px 25px 30px}.right{padding:28px 18px}.amount{font-size:48px}.logo{width:74px;height:74px}.card{padding:24px}}
@media(max-width:480px){.left{padding:22px 20px}.right{padding:18px 12px 26px}.card{border-radius:16px;padding:20px}.card h1{font-size:24px}.qr{width:205px;height:205px}.amount{font-size:43px}.company{font-size:23px}}
</style>
</head>
<body><div id="app"></div>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function decode(){try{const p=new URLSearchParams(location.hash.slice(1)).get('p');if(!p)return null;let s=p.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}catch{return null}}
function fmtDate(v){if(!v)return '—';return new Date(v+'T12:00:00').toLocaleDateString('pt-BR')}
function track(d,event){if(!d.trackingEndpoint)return;const payload=JSON.stringify({event,invoice:d.invoice,customer:d.customer,amount:d.amount,at:new Date().toISOString(),page:location.href,userAgent:navigator.userAgent});try{if(navigator.sendBeacon){navigator.sendBeacon(d.trackingEndpoint,new Blob([payload],{type:'text/plain;charset=UTF-8'}));return}fetch(d.trackingEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:payload,keepalive:true}).catch(()=>{})}catch{}}
function localManualReceipt(d){try{const list=JSON.parse(localStorage.getItem('bussi.charges.v1')||'[]');const c=list.find(x=>String(x.invoice)===String(d.invoice)&&x.status==='Pagamento confirmado');return c&&c.receiptUrl?c.receiptUrl:null}catch{return null}}
function goStatus(){const u=new URL('status-pagamento.html',location.href);u.hash=location.hash.slice(1)+'&s=checking';location.href=u.href}

const d=decode();
if(!d){document.getElementById('app').innerHTML='<div class="error"><h1>Link de cobrança inválido</h1><p>Não foi possível localizar os dados desta fatura.</p><a href="politica-de-privacidade.html">Política de Privacidade</a></div>';throw new Error('invalid payload')}
track(d,'link_opened');
const discountValue=Math.max(0,Number(d.original||d.amount)-Number(d.amount||0));

document.getElementById('app').innerHTML=`<main class="page">
<section class="left">
<button class="download" id="downloadCharge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14"/></svg>Baixar fatura</button>
<div class="logo-row"><img class="logo" src="logo-consig.svg" alt="CONSIG BENEFÍCIOS"></div>
<div class="company">${esc(d.company||'CONSIG BENEFÍCIO S/A')}</div>
<div class="cnpj">CNPJ: ${esc(d.cnpj||'66.754.630/0001-60')}</div>
<div class="address">${esc(d.companyAddress||'Avenida Doutor Cardoso de Melo, nº 1.855, Vila Olímpia, São Paulo/SP, CEP 04548-005')}</div>
<div class="amount">${money(d.amount)}</div>
<div class="due">Vencimento: ${fmtDate(d.due)}</div>
<div class="invoice-no">Fatura n.º ${esc(d.invoice||'—')}</div>
<div class="issue">Data de emissão: ${fmtDate(d.issueDate)}</div>
<div class="badge">${Number(d.discount||50).toFixed(0)}% OFF aplicado</div>
<div class="divider"></div>
<div class="client"><b>${esc(d.customer||'Cliente')}</b>Contrato / referência: ${esc(d.contract||d.invoice||'—')}</div>
<div class="item"><div><b>Consig Benefícios</b><small>Quantidade: ${Number(d.quantity||1)} · ${esc(d.description||'P/Consignado')}</small></div><b>${money(d.amount)}</b></div>
<div class="summary">
<div class="row original"><span>Parcela original</span><strong>${money(d.original||d.amount)}</strong></div>
<div class="row discount"><span>Desconto ${Number(d.discount||50).toFixed(0)}% OFF</span><strong>− ${money(discountValue)}</strong></div>
<div class="row"><span>Parcela com desconto</span><strong>${money(d.amount)}</strong></div>
<div class="row total"><span>VALOR A SER PAGO</span><strong>${money(d.amount)}</strong></div>
</div>
</section>
<section class="right"><div class="card">
<h1>Pagamento via Pix</h1>
<p>Escaneie o QR Code ou copie o código Pix abaixo.</p>
<div class="qr" id="qr"></div>
<div class="pixlabel">Pix Copia e Cola</div>
<div class="pixcode" id="pixCode">${esc(d.pix||'')}</div>
<button class="copy" id="copyPix">Copiar código PIX</button>
<div class="helper">Após o pagamento, aguarde a conferência da equipe. Esta página será redirecionada automaticamente para o acompanhamento do pagamento.</div>
</div></section>
<footer class="legal">Cobrança emitida por <b>${esc(d.company||'CONSIG BENEFÍCIO S/A')}</b> · CNPJ ${esc(d.cnpj||'66.754.630/0001-60')}<br>${esc(d.email||'sac@consigbeneficio.com.br')}<br><a href="termos-de-uso.html">Termos de Uso</a> · <a href="politica-de-privacidade.html">Política de Privacidade</a> · <a href="exclusao-de-dados.html">Exclusão de Dados</a></footer>
</main>`;

new QRCode(document.getElementById('qr'),{text:d.pix||'',width:200,height:200,correctLevel:QRCode.CorrectLevel.M});
document.getElementById('copyPix').onclick=async()=>{try{await navigator.clipboard.writeText(d.pix||'');track(d,'pix_copied');document.getElementById('copyPix').textContent='Código PIX copiado';setTimeout(()=>document.getElementById('copyPix').textContent='Copiar código PIX',1300)}catch{alert('Não foi possível copiar automaticamente. Selecione o código acima.')}};

let elapsed=0;
const poll=setInterval(()=>{
  elapsed+=2;
  const receipt=localManualReceipt(d);
  if(receipt){clearInterval(poll);location.href=receipt;return}
  if(elapsed>=40){clearInterval(poll);goStatus()}
},2000);

function invoiceMarkup(){
  const issue=fmtDate(d.issueDate);
  return `<!doctype html><html><head><meta charset="utf-8"><title>Fatura ${esc(d.invoice)}</title><style>@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#171717}.p{width:210mm;height:297mm;padding:22mm 18mm;position:relative}.topi{display:flex;justify-content:space-between}.co b{font-size:12px}.co small{display:block;color:#666;margin-top:3px}.customer{font-size:17px;font-weight:700;margin-top:30mm}.meta{width:78mm;text-align:right}.ilog{width:28mm;height:28mm;object-fit:cover;border-radius:5mm;margin-bottom:4mm}.meta h1{font-size:21px}.line{display:flex;justify-content:space-between;border-top:1px solid #ddd;padding:7px 0;font-size:12px}.tbl{width:100%;border-collapse:collapse;margin-top:28mm;font-size:11px}.tbl th{background:#e6e6e6;text-align:left;padding:9px}.tbl td{padding:10px 9px;border-bottom:1px solid #eee}.num{text-align:right!important}.tot{width:82mm;margin:16mm 0 0 auto}.tr{display:flex;justify-content:space-between;padding:7px 9px;font-size:12px}.tr.original b{text-decoration:line-through;text-decoration-thickness:2px}.tr.final{font-weight:800;background:#e4e4e4;font-size:14px}.qrprint{position:absolute;left:18mm;bottom:31mm;width:30mm;text-align:center;font-size:9px;color:#666}.qrprint #invoiceQr{width:24mm;height:24mm;margin:auto}.foot{position:absolute;bottom:18mm;left:18mm;right:18mm;text-align:center;color:#666;font-size:10px;line-height:1.5}</style></head><body><div class="p"><div class="topi"><div class="co"><b>${esc(d.company)}</b><small>CNPJ: ${esc(d.cnpj)}</small><small>${esc(d.companyAddress||'')}</small><div class="customer">${esc(d.customer)}</div></div><div class="meta"><img class="ilog" src="logo-consig.svg" alt="CONSIG BENEFÍCIOS"><h1>Fatura</h1><div class="line"><span>Fatura</span><b>${esc(d.invoice)}</b></div><div class="line"><span>Data de emissão</span><b>${issue}</b></div></div></div><table class="tbl"><thead><tr><th>Descrição</th><th>Unidade</th><th class="num">P/Total</th><th class="num">P/Desconto</th></tr></thead><tbody><tr><td>Black Friday 50% OFF — ${esc(d.description||'P/Consignado')} — Competência: Dezembro</td><td>1</td><td class="num">${money(d.original)}</td><td class="num">${money(d.amount)}</td></tr></tbody></table><div class="tot"><div class="tr original"><span>Parcela original</span><b>${money(d.original)}</b></div><div class="tr"><span>Parcela com desconto</span><b>${money(d.amount)}</b></div><div class="tr final"><span>VALOR A SER PAGO</span><span>${money(d.amount)}</span></div></div><div class="qrprint"><div id="invoiceQr"></div><small>Pagamento via Pix</small></div><div class="foot"><b>${esc(d.company)}</b><br>CNPJ: ${esc(d.cnpj)} · ${esc(d.email)}<br>${esc(d.companyAddress||'')}</div></div></body></html>`
}
document.getElementById('downloadCharge').onclick=()=>{track(d,'invoice_download');const w=window.open('','_blank');if(!w)return alert('Permita pop-ups para baixar a fatura.');w.document.open();w.document.write(invoiceMarkup());w.document.close();setTimeout(()=>{const q=w.document.getElementById('invoiceQr');if(q)new QRCode(q,{text:d.pix||'',width:90,height:90,correctLevel:QRCode.CorrectLevel.M});setTimeout(()=>{w.focus();w.print()},250)},150)};
</script>
</body>
</html>
