<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Status do pagamento — CONSIG BENEFÍCIOS</title>
<style>
:root{--ink:#11151a;--muted:#6d737c;--line:#e4e7eb;--green:#16866f;--greenbg:#eaf8f3;--amber:#835b12;--amberbg:#fff7e8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef0f3;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:20px}
.wrap{width:min(620px,100%);background:#fff;border-radius:22px;box-shadow:0 18px 55px rgba(0,0,0,.08);overflow:hidden}.head{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px}.headlogo{width:62px;height:62px;border-radius:14px;object-fit:cover}.brand{font-size:13px;font-weight:850;text-align:right}.brand small{display:block;color:var(--muted);font-weight:500;margin-top:4px}.body{padding:34px 28px;text-align:center}.icon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font-size:32px;font-weight:900}.icon.checking{background:var(--amberbg);color:var(--amber)}.icon.confirmed{background:var(--greenbg);color:var(--green)}h1{font-size:26px;margin:0 0 9px}.lead{color:var(--muted);line-height:1.55;margin:0 auto 22px;max-width:460px}.summary{border:1px solid var(--line);border-radius:14px;text-align:left;margin:22px 0;padding:15px 17px}.row{display:flex;justify-content:space-between;gap:20px;padding:7px 0;font-size:13px}.row span{color:var(--muted)}.row b{text-align:right}.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;text-decoration:none;text-align:center;margin-top:10px;background:#18212c;color:#fff}.btn.green{background:var(--green)}.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:16px}.foot{padding:18px 22px;background:#f6f7f8;text-align:center;color:#707780;font-size:11px;line-height:1.6}.foot a{color:inherit;margin:0 5px}.spin{width:22px;height:22px;border:3px solid #ead7ad;border-top-color:var(--amber);border-radius:50%;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:520px){.body{padding:28px 20px}.head{padding:22px 20px}h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><img class="headlogo" src="logo-consig.svg" alt="CONSIG BENEFÍCIOS"><div class="brand">CONSIG BENEFÍCIO S/A<small>CNPJ 66.754.630/0001-60</small></div></div>
  <div class="body" id="body"></div>
  <div class="foot">sac@consigbeneficio.com.br<br><a href="termos-de-uso.html">Termos de Uso</a> · <a href="politica-de-privacidade.html">Política de Privacidade</a> · <a href="exclusao-de-dados.html">Exclusão de Dados</a></div>
</div>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function decode(){try{const p=new URLSearchParams(location.hash.slice(1)).get('p');if(!p)return null;let s=p.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}catch{return null}}
function isPaidStatus(v){return ['paid','confirmed','pago','aprovado','approved','settled','liquidado','completed'].includes(String(v||'').toLowerCase())}
async function queryPayment(d){
  if(!d.paymentStatusEndpoint)return null;
  try{
    const u=new URL(d.paymentStatusEndpoint,location.href);
    u.searchParams.set('invoice',d.invoice||'');
    u.searchParams.set('amount',String(d.amount||''));
    const res=await fetch(u.href,{method:'GET',headers:{'Accept':'application/json'},cache:'no-store'});
    if(!res.ok)return null;
    return await res.json()
  }catch{return null}
}
const d=decode();
if(!d){document.getElementById('body').innerHTML='<h1>Link inválido</h1><p class="lead">Não foi possível identificar esta cobrança.</p>';throw new Error('invalid payload')}
const originalHash=location.hash.slice(1).replace(/&s=[^&]*/g,'');
function paymentUrl(){const u=new URL('pagamento.html',location.href);u.hash=originalHash;return u.href}
function summary(){return '<div class="summary"><div class="row"><span>Cliente</span><b>'+esc(d.customer||'—')+'</b></div><div class="row"><span>Cobrança</span><b>'+esc(d.invoice||'—')+'</b></div><div class="row"><span>Valor</span><b>'+money(d.amount)+'</b></div></div>'}
function localManualReceipt(){try{const list=JSON.parse(localStorage.getItem('bussi.charges.v1')||'[]');const c=list.find(x=>String(x.invoice)===String(d.invoice)&&x.status==='Pagamento confirmado');return c&&c.receiptUrl?c.receiptUrl:null}catch{return null}}
function renderChecking(){
  document.getElementById('body').innerHTML='<div class="icon checking"><div class="spin"></div></div><h1>Estamos verificando seu pagamento</h1><p class="lead">A confirmação é realizada manualmente pela equipe após a conferência do crédito recebido. Você não precisa realizar um novo Pix enquanto esta verificação estiver em andamento.</p>'+summary()+'<a class="btn" href="'+paymentUrl()+'">Voltar ao pagamento</a><div class="note" id="pollNote">'+(d.paymentStatusEndpoint?'Atualizando o status automaticamente...':'Aguardando integração com o provedor financeiro para confirmação automática.')+'</div>'
}
function renderConfirmed(data){
  const receipt=data&&data.receiptUrl?'<a class="btn green" target="_blank" rel="noopener" href="'+esc(data.receiptUrl)+'">Abrir comprovante</a>':'';
  document.getElementById('body').innerHTML='<div class="icon confirmed">✓</div><h1>Pagamento confirmado</h1><p class="lead">Recebemos a confirmação financeira desta cobrança.</p>'+summary()+receipt+'<div class="note">Se o comprovante não estiver disponível agora, ele poderá ser disponibilizado após a liquidação completa.</div>'
}
renderChecking();
let stopped=false;
async function poll(){
  if(stopped)return;
  const localReceipt=localManualReceipt();if(localReceipt){stopped=true;location.href=localReceipt;return}
  const data=await queryPayment(d);
  if(data&&isPaidStatus(data.status)){stopped=true;renderConfirmed(data);return}
  setTimeout(poll,5000)
}
poll();
</script>
</body>
</html>
