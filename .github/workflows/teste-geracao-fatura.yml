name: Validar sessao e salvamento BUSSI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/teste-geracao-fatura.yml', 'index.html', 'portal.html', 'bussi-nitro.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir estrutura e sintaxe, sem realizar cobranças
        run: |
          node --check bussi-nitro.js
          cmp index.html portal.html
          node <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('bussi-nitro.js','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(Boolean);
          for(const script of scripts) new Function(script);
          for(const id of ['bussiCloudSyncStatus','cDocument','cEmail','prepareRealPix7']) assert.ok(html.includes('id="'+id+'"'));
          for(const part of ['persistSession:true','autoRefreshToken:true','getAuthenticatorAssuranceLevel','startCloudSync','bussi_portal_arquivos','uploadSnapshot']) assert.ok(js.includes(part));
          assert.ok(js.includes('bussi_emitir_link_cliente'));
          assert.ok(html.includes('sac@consigbeneficio.com.br'));
          assert.ok(!html.includes("$('generateCharge').onclick="));
          console.log('OK: sessao Supabase persistente, validacao MFA, dados de clientes e sincronizacao em nuvem.');
          NODE
