name: Validar emissao BUSSI e integracao de recebimento
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/teste-geracao-fatura.yml'
      - 'index.html'
      - 'portal.html'
      - 'bussi-nitro.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fluxo-sem-cobranca-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar verificador de interface
        run: npm install --prefix /tmp/bussi-e2e --no-audit --no-fund playwright-core
      - name: Servir os arquivos locais
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bussi-e2e-server.log 2>&1 &
          sleep 2
      - name: Validar cadastro verdadeiro, desconto e emissao BUSSI com API simulada
        run: |
          node <<'NODE'
          const fs=require('fs');
          const assert=require('node:assert/strict');
          const {chromium}=require('/tmp/bussi-e2e/node_modules/playwright-core');
          (async()=>{
            const paths=['/usr/bin/google-chrome','/usr/bin/chromium','/opt/google/chrome/chrome'];
            const exe=paths.find(p=>fs.existsSync(p));
            if(!exe)throw Error('Chrome/Chromium nao encontrado');
            const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox']});
            try {
              const page=await browser.newPage();
              const errors=[];
              let emission=0, gateway=0, received=null;
              page.on('pageerror',e=>errors.push(e.message));
              await page.route('https://yzhjtqwpmxhigrijiuze.supabase.co/**',async route=>{
                const req=route.request(), url=new URL(req.url());
                const headers={
                  'access-control-allow-origin':'*',
                  'access-control-allow-headers':'apikey, authorization, content-type',
                  'access-control-allow-methods':'GET, POST, OPTIONS',
                  'content-type':'application/json'
                };
                if(req.method()==='OPTIONS')return route.fulfill({status:204,headers});
                let result={},status=200;
                if(url.pathname==='/auth/v1/token')result={access_token:'mock-signin-token'};
                else if(url.pathname==='/auth/v1/user')result={factors:[{id:'mfa-test',factor_type:'totp',status:'verified'}]};
                else if(url.pathname.endsWith('/challenge'))result={id:'challenge-test'};
                else if(url.pathname.endsWith('/verify'))result={access_token:'mock-aal2-token'};
                else if(url.pathname.endsWith('/bussi_historico_faturas'))result=[];
                else if(url.pathname.endsWith('/bussi_resumo_recebimentos'))result={quantidade:0,total_centavos:'0'};
                else if(url.pathname.endsWith('/bussi_dashboard_faturas'))result={faturas:0,pagas:0,aguardando:0,recebido_centavos:0,aguardando_centavos:0};
                else if(url.pathname.endsWith('/bussi_emitir_link_cliente')){
                  emission++;
                  received=req.postDataJSON();
                  result={numero:9001,token:'a'.repeat(64)};
                }
                else if(url.pathname.includes('/functions/v1/fatura-bussi')){gateway++;status=500;result={erro:'Nao emitir pagamentos durante testes automaticos'};}
                else {status=404;result={message:'Endpoint nao previsto no teste local'};}
                return route.fulfill({status,headers,body:JSON.stringify(result)});
              });
              const response=await page.goto('http://127.0.0.1:8765/index.html#faturas',{waitUntil:'domcontentloaded',timeout:30000});
              assert.equal(response.status(),200);
              if(await page.locator('#setupAuth').isVisible()){
                await page.locator('#setupPass').fill('AcessoLocalTemporario123!');
                await page.locator('#setupPass2').fill('AcessoLocalTemporario123!');
                await page.locator('#createAccess').click();
              }
              await page.locator('#mainApp').waitFor({state:'visible'});
              await page.locator('.nav button[data-view="charges"]').click();
              await page.locator('#nitroEmail').fill('teste@exemplo.org');
              await page.locator('#nitroPassword').fill('SenhaDeTeste123!');
              await page.locator('#nitroLoginForm button[type="submit"]').click();
              await page.locator('#nitroCode').fill('123456');
              await page.locator('#nitroVerifyForm button[type="submit"]').click();
              await page.locator('#prepareRealPix7').waitFor({state:'visible'});
              await page.locator('#prepareRealPix7').click();
              assert.equal(await page.locator('#cOriginal').inputValue(),'14,00');
              assert.equal(await page.locator('#cFinal').inputValue(),'7,00');
              assert.equal(await page.locator('#cName').inputValue(),'');
              await page.locator('#cName').fill('Pessoa de Validacao');
              await page.locator('#cPhone').fill('11999990000');
              await page.locator('#cDocument').fill('52998224725');
              await page.locator('#cEmail').fill('teste@exemplo.org');
              await page.locator('#saveClient').click();
              assert.equal(await page.locator('#chargeOriginal').inputValue(),'14,00');
              assert.equal(await page.locator('#chargeFinal').inputValue(),'7,00');
              await page.locator('#generateCharge').click();
              await page.locator('#nitroGenerated').waitFor({state:'visible'});
              assert.equal(emission,1);
              assert.equal(received.p_original,1400);
              assert.equal(received.p_pagador.document,'52998224725');
              assert.equal(received.p_pagador.name,'Pessoa de Validacao');
              assert.equal(gateway,0);
              const link=await page.locator('#nitroGeneratedLink').inputValue();
              assert.equal(link,'https://pay.consigbeneficio.com.br/fatura9001#'+'a'.repeat(64));
              assert.deepEqual(errors,[]);
              console.log('TESTE PASSOU: cadastro local valido, R$14 -> R$7, chamada ao BUSSI simulada, nenhuma transacao Nitro criada.');
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
