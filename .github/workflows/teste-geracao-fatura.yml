name: Teste ponta a ponta de fatura BUSSI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/teste-geracao-fatura.yml', 'portal.html', 'pagamento.html']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar navegador de teste
        run: |
          npm install --prefix /tmp/bussi-e2e --no-audit --no-fund playwright-core
      - name: Abrir portal, emitir fatura ficticia, abrir pagamento HTTPS
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('/tmp/bussi-e2e/node_modules/playwright-core');
          (async()=>{
            const executables=['/usr/bin/google-chrome','/usr/bin/chromium','/opt/google/chrome/chrome'];
            const exe=executables.find(x=>fs.existsSync(x));
            if(!exe)throw new Error('Browser indisponivel');
            const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox']});
            try{
              const ctx=await browser.newContext();
              const page=await ctx.newPage();
              const errs=[];
              page.on('pageerror',e=>errs.push(e.message));
              const initial='https://consigbeneficios.github.io/bussi/portal.html?versao=segura';
              const response=await page.goto(initial,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1500);
              if(response.status()!==200)throw new Error('Portal HTTP '+response.status());
              if(page.url().startsWith('https://pay.consigbeneficio.com.br'))throw new Error('Portal redirecionou para pay sem SSL');
              if(await page.locator('#setupAuth').isVisible()){
                await page.locator('#setupPass').fill('TesteTemporario987!');
                await page.locator('#setupPass2').fill('TesteTemporario987!');
                await page.locator('#createAccess').click();
              }
              await page.locator('#mainApp').waitFor({state:'visible',timeout:15000});
              console.log('PORTAL OK HTTPS',page.url());
              await page.locator('#pixType').selectOption('email');
              await page.locator('#pixKey').fill('teste.nao.pagavel@exemplo.org');
              await page.locator('#pixName').fill('TESTE NAO PAGAVEL');
              await page.locator('#pixCity').fill('SAO PAULO');
              await page.locator('button[data-view="charges"]').click();
              await page.locator('#chargeClient option').first().waitFor();
              await page.locator('#chargeOriginal').fill('1200,00');
              await page.locator('#chargeDiscount').fill('50');
              await page.locator('#generateCharge').click();
              await page.locator('#generatedBox').waitFor({state:'visible',timeout:15000});
              const payment=await page.locator('#generatedLink').inputValue();
              const url=new URL(payment);
              if(url.origin!=='https://consigbeneficios.github.io' || url.pathname!=='/bussi/pagamento.html' || !url.hash.startsWith('#p='))throw new Error('URL de fatura incorreta '+url.origin+url.pathname);
              console.log('LINK GERADO CORRETAMENTE',url.origin+url.pathname,'fragmento=',url.hash.length);
              const pay=await ctx.newPage();
              pay.on('pageerror',e=>errs.push('PAGAMENTO: '+e.message));
              const payResponse=await pay.goto(payment,{waitUntil:'domcontentloaded',timeout:30000});
              await pay.locator('#payPix').waitFor({state:'visible',timeout:15000});
              if(payResponse.status()!==200 || !await pay.locator('body').innerText().then(v=>v.includes('Pagar com PIX')))throw new Error('Fatura nao carregou em HTTPS');
              await pay.locator('#payPix').click();
              await pay.locator('#pixReveal.open').waitFor({state:'visible',timeout:15000});
              console.log('PAGAMENTO OK',payResponse.status(),new URL(pay.url()).origin+new URL(pay.url()).pathname);
              console.log('ERROS JS',JSON.stringify(errs));
              if(errs.length)throw new Error('Erros Javascript no navegador');
            } finally {await browser.close()}
          })().catch(e=>{console.error('FALHA',e.message);process.exit(1)})
          NODE
