name: Validar sessao e salvamento BUSSI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/teste-geracao-fatura.yml', 'index.html', 'portal.html', 'bussi-nitro.js', 'comprovante-liquidacao.html']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir integridade de autenticacao e dados
        run: |
          set -euo pipefail
          cmp index.html portal.html
          node --check bussi-nitro.js
          node <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8'),js=fs.readFileSync('bussi-nitro.js','utf8');
          assert.match(html,/function showAuth\(/);
          assert.match(html,/function enterApp\(/);
          assert.doesNotMatch(html,/setupPass/);
          assert.doesNotMatch(html,/id="prepareRealPix7"/);
          assert.match(html,/id="cDocument"/);
          assert.match(html,/id="cEmail"/);
          assert.match(js,/persistSession:true/);
          assert.match(js,/autoRefreshToken:true/);
          assert.match(js,/getAuthenticatorAssuranceLevel/);
          assert.match(js,/bussi_portal_arquivos/);
          assert.match(js,/BACKUP_TABLE,\{conteudo:snapshot\}/);
          assert.doesNotMatch(js,/assinatura:sig/);
          assert.match(js,/bussi_20261121_payment_0013/);
          assert.match(html,/sac@consigbeneficio.com.br/);
          console.log('BUSSI: MFA persistente, insert na tabela com coluna gerada e base reiniciada.');
          NODE
