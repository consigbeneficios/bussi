name: Verificacao do portal BUSSI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/teste-real-portal.yml'
      - 'index.html'
      - 'portal.html'
      - 'bussi-nitro.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar integridade da interface e seu modulo de emissao
        run: |
          set -euo pipefail
          test -s index.html
          test -s bussi-nitro.js
          cmp index.html portal.html
          node --check bussi-nitro.js
          node <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('bussi-nitro.js','utf8');
          assert.match(html, /id="prepareRealPix7"/);
          assert.match(html, /Emitir fatura pelo BUSSI/);
          assert.match(html, /id="cDocument"/);
          assert.match(html, /id="cEmail"/);
          assert.match(html, /14,00/);
          assert.match(html, /7,00/);
          assert.match(js, /bussi_emitir_link_cliente/);
          assert.match(js, /fatura.*padStart\(4/);
          assert.doesNotMatch(html, /const defaultClients=\[/);
          assert.doesNotMatch(html, /\$\('generateCharge'\)\.onclick=/);
          console.log('Portal unico BUSSI validado sem novas cobrancas reais.');
          NODE
